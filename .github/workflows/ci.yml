name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # The engine is the one place where a silent bug becomes wrong financial advice.
      # A changed formula without a version bump fails the build.
      - name: Engine version guard
        run: node scripts/engine-version-guard.mjs

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @wealthplanner/web exec playwright install --with-deps chromium
      # Covers what only breaks in a browser: hydration, the debounced recommendation pass,
      # applying a proven fix, and persistence across a reload. Any console error fails.
      - name: End-to-end
        run: pnpm --filter @wealthplanner/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
